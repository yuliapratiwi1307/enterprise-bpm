function sjrV541RichPlain(text){
 // Existing V5.2 API stores plain text. Escape first and auto-link validated URLs;
 // do not attempt to reconstruct formatting that was never persisted.
 const plain=String(text||'-');const urlRe=/https?:\/\/[^\s<>"']+/g;
 let out='',last=0,match;
 while((match=urlRe.exec(plain))!==null){
  const raw=match[0],clean=raw.replace(/[.,;!?)]+$/,'');
  out+=esc(plain.slice(last,match.index));
  if(clean){out+='<a href="'+esc(clean)+'" target="_blank" rel="noopener noreferrer">'+esc(clean)+'</a>'+esc(raw.slice(clean.length));}
  else out+=esc(raw);
  last=match.index+raw.length;
 }
 return out+esc(plain.slice(last));
}

  const id=Number(item.id),rec=sjrV554Cache.get(id),name=String(item.item_name||('Item '+(index+1)));
  events.push({title:name+' · Brief Designer tersedia',note:'Deadline '+sjrDate(item.designer_deadline),order:index});

   const versions=[...(rec.data.versions||[])].sort((a,b)=>Number(a.version)-Number(b.version));
   for(const version of versions){
    const rev=(rec.data.reviews||[]).find(r=>Number(r.submission_id)===Number(version.id));
    const ver='Versi '+Number(version.version);
    events.push({title:name+' · '+ver+(version.state==='DRAFT'?' disimpan sebagai Draft':' dikirim Designer'),note:String(version.note||'-'),order:index*100+Number(version.version)*2});
    if(rev)events.push({title:name+' · '+ver+(rev.decision==='APPROVED'?' disetujui Marketing':' diminta revisi'),note:String(rev.note||'-'),order:index*100+Number(version.version)*2+1});
   }

 }
 return events.map(e=>`<div class="sjr-v5511-event"><strong>${esc(e.title)}</strong><small>${esc(e.note)}</small></div>`).join('');
}

 const needs=all.filter(x=>!!x.requires_designer);
 const incomplete=needs.filter(x=>String(x.design_state)!=='APPROVED');
 return {ready:all.length>0&&incomplete.length===0, sent:!!sent, approved:needs.length-incomplete.length,
   needed:needs.length, total:all.length, incomplete};
}

 function sjrV554Panel(itemId,record){

 async function sjrV554Load(itemId, force=false){

     const data=await r.json();if(!r.ok)throw new Error(data.message||'Gagal membaca riwayat item.');
     sjrV554Cache.set(itemId,{data});
   }catch(e){sjrV554Cache.set(itemId,{error:e.message});}
   sjrV554RefreshSlots();
   const activity=document.getElementById('sjrV5511Activity'),job=state.jobs.find(j=>j.id===state.selected),entry=sjrV54Cache.get(job?.id);
   if(activity&&entry?.data?.items)activity.innerHTML=sjrV5511Activity(entry.data.items,job);

 function sjrV554RefreshSlots(){
   if(state.role!=='marketing'||state.page!=='detail')return;
   document.querySelectorAll('[data-review-item]').forEach(slot=>{
     const id=Number(slot.dataset.reviewItem),entry=sjrV554Cache.get(id);

 function sjrV554Hydrate(){

 async function sjrV554Submit(event,itemId){

   if(!['approve','revision'].includes(action))return;

   if(!window.confirm(confirmText))return;
   const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);error.hidden=true;
   try{
     const body={submission_id:Number(form.elements.submission_id.value),decision:action,note};
     const r=await fetch('/simple-jobs/api/marketing-items-v55/'+itemId+'/review',{method:'POST',credentials:'same-origin',headers:{'Accept':'application/json','Content-Type':'application/json','X-CSRF-TOKEN':document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify(body)});
     const data=await r.json();if(!r.ok)throw new Error(data.errors?Object.values(data.errors).flat().join(' '):data.message||'Gagal menyimpan review.');
